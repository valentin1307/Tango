<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tango: Feuer &amp; Wasser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF8EE;
    --bg-secondary: #FFEFD9;
    --card: #ffffff;
    --text: #2D1B4E;
    --text-secondary: #7C6E9B;
    --border: rgba(45,27,78,0.10);
    --border-strong: rgba(45,27,78,0.18);

    --fire: #FF5A36;
    --fire-given: #FF8A6B;
    --fire-fill: #FFD2C4;
    --fire-text: #B23310;

    --water: #1E9DE3;
    --water-given: #5DBBF0;
    --water-fill: #C6E8FB;
    --water-text: #0B5E8C;

    --yellow: #FFC94A;
    --success: #2E9E5B;
    --danger: #E0473E;

    --radius: 12px;
    --radius-lg: 18px;
    --shadow: 0 4px 14px rgba(45,27,78,0.08);
    --shadow-press: 0 1px 4px rgba(45,27,78,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #221733;
      --bg-secondary: #2E2049;
      --card: #2A1E42;
      --text: #F5EFFF;
      --text-secondary: #B6A8D9;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.20);
      --fire-fill: #5A2A1F;
      --fire-given: #FF8A6B;
      --fire-text: #FFD2C4;
      --water-fill: #1C3F55;
      --water-given: #5DBBF0;
      --water-text: #C6E8FB;
      --shadow: 0 4px 18px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 32px 16px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }
  .app {
    max-width: 460px;
    width: 100%;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-family: "Fredoka", sans-serif;
    font-size: 30px;
    font-weight: 700;
    text-align: center;
    margin: 0 0 4px;
    letter-spacing: 0.01em;
  }
  h1 .fire-word { color: var(--fire); }
  h1 .water-word { color: var(--water); }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 20px;
    font-weight: 500;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 8px;
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  .level-select {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .level-select label {
    font-family: "Fredoka", sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  input[type="number"], input[type="text"] {
    background: var(--bg-secondary);
    color: var(--text);
    border: 1.5px solid transparent;
    border-radius: var(--radius);
    padding: 8px 10px;
    font-size: 14px;
    font-weight: 600;
    font-family: "Fredoka", "Inter", sans-serif;
    transition: border-color 0.15s ease;
  }
  input[type="number"]:focus, input[type="text"]:focus {
    outline: none;
    border-color: var(--water);
  }
  input[type="number"] { width: 64px; text-align: center; }
  .level-of {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .timer {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "Fredoka", sans-serif;
    font-size: 20px;
    font-weight: 600;
    background: var(--bg-secondary);
    padding: 6px 14px;
    border-radius: var(--radius);
  }
  #status {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 12px;
    min-height: 22px;
    transition: color 0.2s ease;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    position: relative;
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 10px;
    box-shadow: var(--shadow);
  }
  .cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    position: relative;
    background: var(--bg-secondary);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .cell:not(.given):hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-press);
  }
  .cell:not(.given):active {
    transform: translateY(0) scale(0.95);
  }
  .cell.given { cursor: default; }
  .cell svg { width: 56%; height: 56%; }
  .cell.fire svg {
    animation: flicker 2.2s ease-in-out infinite;
    transform-origin: 50% 85%;
  }
  .cell.water svg {
    animation: ripple 3s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.05, 0.97) rotate(-2deg); }
    50% { transform: scale(0.97, 1.04) rotate(1deg); }
    75% { transform: scale(1.03, 0.98) rotate(2deg); }
  }
  @keyframes ripple {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2px) scale(1.03); }
  }
  @keyframes pop-in {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .cell.just-placed svg {
    animation: pop-in 0.25s ease-out;
  }
  .hint {
    position: absolute;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Fredoka", sans-serif;
    font-size: 14px;
    font-weight: 600;
    background: var(--card);
    border: 1.5px solid var(--border-strong);
    border-radius: 50%;
    color: var(--text);
    z-index: 2;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 6px rgba(45,27,78,0.12);
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  button {
    background: var(--card);
    color: var(--text);
    border: none;
    border-radius: var(--radius);
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    font-family: "Inter", sans-serif;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0) scale(0.97); box-shadow: var(--shadow-press); }
  button.primary {
    background: linear-gradient(135deg, var(--fire), var(--water));
    color: #fff;
  }
  .leaderboard-section {
    margin-top: 36px;
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .leaderboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  h2 {
    font-family: "Fredoka", sans-serif;
    font-size: 20px;
    font-weight: 600;
    margin: 0;
  }
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg-secondary);
    border-radius: var(--radius);
    padding: 3px;
  }
  .tabs button {
    font-size: 12px;
    padding: 6px 12px;
    box-shadow: none;
    background: transparent;
  }
  .tabs button.active {
    background: var(--card);
    box-shadow: var(--shadow-press);
  }
  .name-field {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .name-field input { flex: 1; }
  .lb-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 500;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-row .rank {
    font-family: "Fredoka", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    min-width: 24px;
    display: inline-flex;
  }
  .lb-row:nth-child(1) .rank { color: var(--yellow); }
  .lb-row:nth-child(2) .rank { color: var(--water); }
  .lb-row:nth-child(3) .rank { color: var(--fire); }
  .lb-row .value {
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
  }
  .lb-empty {
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0;
    padding: 12px 0;
  }
  .footer-note {
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 20px;
    line-height: 1.6;
  }
  .confetti {
    position: fixed;
    top: -10px;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 50;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to {
      transform: translateY(105vh) rotate(360deg);
      opacity: 0.9;
    }
  }
</style>
</head>
<body>
<div class="app">
  <h1><span class="fire-word">Feuer</span> &amp; <span class="water-word">Wasser</span></h1>
  <p class="subtitle">Ein Tango-Logikrätsel</p>

  <div class="top-bar">
    <div class="level-select">
      <label for="level-input">Level</label>
      <input type="number" id="level-input" min="1" max="1000" value="1">
      <span class="level-of">/ 1000</span>
      <button id="go-level">Los</button>
    </div>
    <div class="timer">
      <span id="time">00:00</span>
    </div>
  </div>

  <div id="status"></div>
  <div id="grid"></div>

  <div class="controls">
    <button id="check" class="primary">Prüfen</button>
    <button id="reset">Zurücksetzen</button>
    <button id="prev-level">Vorheriges Level</button>
    <button id="next-level">Nächstes Level</button>
  </div>

  <div class="leaderboard-section">
    <div class="leaderboard-header">
      <h2>Bestenliste</h2>
      <div class="tabs">
        <button id="tab-time" class="active">Schnellste Zeit</button>
        <button id="tab-count">Gelöste Rätsel</button>
      </div>
    </div>
    <div class="name-field">
      <input type="text" id="username" placeholder="Dein Name" maxlength="20">
    </div>
    <div id="leaderboard"></div>
  </div>

  <p class="footer-note">Level 1 = am einfachsten, Level 1000 = am schwersten.<br>Dein Fortschritt wird lokal gespeichert, die Bestenliste ist für alle sichtbar.</p>
</div>

<script src="puzzles_data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SIZE = 6;
const FIRE_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-2 4-2 7a3 3 0 0 0 6 0c1.5 1.5 2 3.5 2 5a6 6 0 0 1-12 0c0-5 4-7 6-12z"/></svg>`;
const WATER_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c4 6 7 9.5 7 13a7 7 0 0 1-14 0c0-3.5 3-7 7-13z"/></svg>`;

const grid = document.getElementById('grid');
const status = document.getElementById('status');
const timeEl = document.getElementById('time');
const leaderboardEl = document.getElementById('leaderboard');
const usernameInput = document.getElementById('username');
const levelInput = document.getElementById('level-input');

let currentLevel = 1;
let solution, given, constraints, state;
let seconds = 0;
let timerInterval = null;
let finished = false;
let leaderboardTab = 'time';

// ---- storage helpers (localStorage based) ----
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {}
}

// load saved username
usernameInput.value = localStorage.getItem('tango_username') || '';
usernameInput.addEventListener('change', () => {
  localStorage.setItem('tango_username', usernameInput.value);
});

// load saved last level
(function(){
  const savedLevel = parseInt(localStorage.getItem('tango_last_level'), 10);
  if (savedLevel >= 1 && savedLevel <= 1000) {
    currentLevel = savedLevel;
    levelInput.value = currentLevel;
  }
})();

// ---- timer ----
function startTimer(){
  if(timerInterval) return;
  timerInterval = setInterval(() => {
    seconds++;
    updateTimeDisplay();
  }, 1000);
}
function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}
function resetTimer(){
  stopTimer();
  seconds = 0;
  updateTimeDisplay();
  finished = false;
}
function updateTimeDisplay(){
  const m = Math.floor(seconds/60).toString().padStart(2,'0');
  const s = (seconds%60).toString().padStart(2,'0');
  timeEl.textContent = m + ':' + s;
}

// ---- puzzle loading from compact data ----
// PUZZLES_DATA[i] = [level, solutionString(36 chars '1'/'2'), givenString "idx:val,...", constraintsString "i1-i2type,..."]
function loadPuzzle(level){
  const entry = PUZZLES_DATA[level - 1];
  if(!entry) return false;
  const [lvl, solStr, givenStr, consStr] = entry;

  solution = [];
  for(let r=0;r<SIZE;r++){
    const row = [];
    for(let c=0;c<SIZE;c++){
      row.push(parseInt(solStr[r*SIZE+c], 10));
    }
    solution.push(row);
  }

  given = {};
  if(givenStr){
    givenStr.split(',').forEach(part => {
      const [idxStr, valStr] = part.split(':');
      const idx = parseInt(idxStr, 10);
      const val = parseInt(valStr, 10);
      const r = Math.floor(idx/SIZE);
      const c = idx % SIZE;
      given[r+'-'+c] = val;
    });
  }

  constraints = [];
  if(consStr){
    consStr.split(',').forEach(part => {
      // format: "i1-i2type" where type is '=' or 'x'
      const type = part.slice(-1);
      const idxPart = part.slice(0, -1);
      const [i1Str, i2Str] = idxPart.split('-');
      const i1 = parseInt(i1Str, 10);
      const i2 = parseInt(i2Str, 10);
      const r1 = Math.floor(i1/SIZE), c1 = i1 % SIZE;
      const r2 = Math.floor(i2/SIZE), c2 = i2 % SIZE;
      constraints.push({a:[r1,c1], b:[r2,c2], type});
    });
  }

  // restore in-progress state if saved, else start fresh
  const savedState = loadJSON('tango_state_' + level, null);
  state = [];
  for(let r=0;r<SIZE;r++){
    state.push([]);
    for(let c=0;c<SIZE;c++){
      const key = r+'-'+c;
      if(given[key] !== undefined){
        state[r].push(given[key]);
      } else if(savedState && savedState[r] && savedState[r][c] !== undefined){
        state[r].push(savedState[r][c]);
      } else {
        state[r].push(0);
      }
    }
  }

  // restore timer if saved (and not finished)
  const savedTime = loadJSON('tango_time_' + level, null);
  const wasFinished = loadJSON('tango_finished_' + level, false);
  resetTimer();
  if(wasFinished){
    finished = true;
    if(savedTime != null){
      seconds = savedTime;
      updateTimeDisplay();
    }
  } else if(savedTime != null){
    seconds = savedTime;
    updateTimeDisplay();
  }

  return true;
}

function cellKey(r,c){return r+'-'+c;}

function persistState(){
  saveJSON('tango_state_' + currentLevel, state);
  saveJSON('tango_time_' + currentLevel, seconds);
}

function render(lastChanged){
  grid.innerHTML = '';
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const cell = document.createElement('div');
      const isGiven = given[cellKey(r,c)] !== undefined;
      let cls = 'cell' + (isGiven ? ' given' : '');

      const val = state[r][c];
      if(val === 1){
        cell.innerHTML = FIRE_SVG;
        cell.style.background = isGiven ? 'var(--fire-given)' : 'var(--fire-fill)';
        cell.style.color = 'var(--fire-text)';
        cls += ' fire';
      } else if(val === 2){
        cell.innerHTML = WATER_SVG;
        cell.style.background = isGiven ? 'var(--water-given)' : 'var(--water-fill)';
        cell.style.color = 'var(--water-text)';
        cls += ' water';
      } else {
        cell.style.background = 'var(--bg-secondary)';
      }
      if(lastChanged && lastChanged[0]===r && lastChanged[1]===c){
        cls += ' just-placed';
      }
      cell.className = cls;

      if(!isGiven){
        cell.addEventListener('click', () => {
          if(finished) return;
          startTimer();
          state[r][c] = (state[r][c] + 1) % 3;
          persistState();
          render([r,c]);
        });
      }

      grid.appendChild(cell);
    }
  }

  // constraint hint overlays
  constraints.forEach(con => {
    const [r1,c1] = con.a;
    const [r2,c2] = con.b;
    const label = document.createElement('div');
    label.className = 'hint';
    label.textContent = con.type;

    const cellPercent = 100 / SIZE;
    if(r1 === r2){
      const leftPercent = (c1 + 1) * cellPercent;
      const topPercent = (r1 + 0.5) * cellPercent;
      label.style.left = leftPercent + '%';
      label.style.top = topPercent + '%';
    } else {
      const leftPercent = (c1 + 0.5) * cellPercent;
      const topPercent = (r1 + 1) * cellPercent;
      label.style.left = leftPercent + '%';
      label.style.top = topPercent + '%';
    }
    grid.appendChild(label);
  });
}

function checkSolution(){
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      if(state[r][c] === 0){
        status.textContent = 'Noch nicht vollständig ausgefüllt';
        status.style.color = 'var(--text-secondary)';
        return;
      }
    }
  }

  let errors = [];

  for(let r=0;r<SIZE;r++){
    const fireCount = state[r].filter(v=>v===1).length;
    if(fireCount !== SIZE/2) errors.push('Zeile ' + (r+1) + ' nicht ausgeglichen');
  }
  for(let c=0;c<SIZE;c++){
    let fireCount = 0;
    for(let r=0;r<SIZE;r++) if(state[r][c]===1) fireCount++;
    if(fireCount !== SIZE/2) errors.push('Spalte ' + (c+1) + ' nicht ausgeglichen');
  }

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE-2;c++){
      if(state[r][c]===state[r][c+1] && state[r][c+1]===state[r][c+2]){
        errors.push('3 gleiche nebeneinander (Zeile ' + (r+1) + ')');
      }
    }
  }
  for(let c=0;c<SIZE;c++){
    for(let r=0;r<SIZE-2;r++){
      if(state[r][c]===state[r+1][c] && state[r+1][c]===state[r+2][c]){
        errors.push('3 gleiche übereinander (Spalte ' + (c+1) + ')');
      }
    }
  }

  constraints.forEach(con => {
    const [r1,c1] = con.a;
    const [r2,c2] = con.b;
    const v1 = state[r1][c1];
    const v2 = state[r2][c2];
    if(con.type === '=' && v1 !== v2){
      errors.push('=-Bedingung verletzt');
    }
    if(con.type === 'x' && v1 === v2){
      errors.push('×-Bedingung verletzt');
    }
  });

  if(errors.length === 0){
    status.textContent = 'Gelöst in ' + timeEl.textContent + '!';
    status.style.color = 'var(--success)';
    stopTimer();
    finished = true;
    saveJSON('tango_finished_' + currentLevel, true);
    persistState();
    submitScore(seconds, currentLevel);
    launchConfetti();
    // unlock next level marker
    const maxUnlocked = parseInt(localStorage.getItem('tango_max_unlocked') || '1', 10);
    if(currentLevel + 1 > maxUnlocked && currentLevel < 1000){
      localStorage.setItem('tango_max_unlocked', String(currentLevel + 1));
    }
  } else {
    status.textContent = errors[0] + (errors.length > 1 ? ' (+' + (errors.length-1) + ' weitere)' : '');
    status.style.color = 'var(--danger)';
  }
}

// ---- confetti ----
function launchConfetti(){
  const colors = ['#FF5A36', '#1E9DE3', '#FFC94A', '#2E9E5B'];
  const count = 60;
  for(let i=0;i<count;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti';
    piece.style.left = Math.random()*100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.width = (6 + Math.random()*6) + 'px';
    piece.style.height = piece.style.width;
    piece.style.animationDuration = (1.8 + Math.random()*1.4) + 's';
    piece.style.animationDelay = (Math.random()*0.3) + 's';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3500);
  }
}

// ---- leaderboard (Supabase) ----

async function renderLeaderboard(){
  leaderboardEl.innerHTML = '<p class="lb-empty">Lädt…</p>';

  let query = supabaseClient.from('leaderboard').select('name,best_time,solved_count');
  if(leaderboardTab === 'time'){
    query = query.not('best_time', 'is', null).order('best_time', { ascending: true });
  } else {
    query = query.order('solved_count', { ascending: false });
  }
  query = query.limit(10);

  const { data, error } = await query;

  if(error){
    leaderboardEl.innerHTML = '<p class="lb-empty">Bestenliste konnte nicht geladen werden</p>';
    console.error('Leaderboard load error', error);
    return;
  }

  if(!data || data.length === 0){
    leaderboardEl.innerHTML = '<p class="lb-empty">Noch keine Einträge</p>';
    return;
  }

  let rows = '';
  data.forEach((e, i) => {
    const value = leaderboardTab === 'time'
      ? Math.floor(e.best_time/60).toString().padStart(2,'0') + ':' + (e.best_time%60).toString().padStart(2,'0')
      : (e.solved_count || 0) + ' gelöst';
    rows += `<div class="lb-row">
      <div><span class="rank">${i+1}</span><span>${escapeHtml(e.name)}</span></div>
      <span class="value">${value}</span>
    </div>`;
  });
  leaderboardEl.innerHTML = rows;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function submitScore(timeInSeconds, level){
  const name = usernameInput.value.trim() || 'Anonym';

  try{
    const { data: existing, error: fetchError } = await supabaseClient
      .from('leaderboard')
      .select('*')
      .eq('name', name)
      .maybeSingle();

    if(fetchError){
      console.error('Leaderboard fetch error', fetchError);
      return;
    }

    const solvedLevels = (existing && existing.solved_levels) || {};
    let solvedCount = (existing && existing.solved_count) || 0;
    if(!solvedLevels[level]){
      solvedLevels[level] = true;
      solvedCount += 1;
    }

    let bestTime = (existing && existing.best_time) != null ? existing.best_time : null;
    if(bestTime === null || timeInSeconds < bestTime){
      bestTime = timeInSeconds;
    }

    const { error: upsertError } = await supabaseClient
      .from('leaderboard')
      .upsert({
        name: name,
        best_time: bestTime,
        solved_count: solvedCount,
        solved_levels: solvedLevels,
        updated_at: new Date().toISOString()
      }, { onConflict: 'name' });

    if(upsertError){
      console.error('Leaderboard upsert error', upsertError);
      return;
    }
  }catch(e){
    console.error('Leaderboard error', e);
    return;
  }

  renderLeaderboard();
}

  }

function goToLevel(level){
  level = Math.max(1, Math.min(1000, level));
  currentLevel = level;
  levelInput.value = level;
  localStorage.setItem('tango_last_level', String(level));
  status.textContent = '';
  loadPuzzle(level);
  render();
}

document.getElementById('go-level').addEventListener('click', () => {
  const val = parseInt(levelInput.value, 10);
  if(!isNaN(val)) goToLevel(val);
});
levelInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    const val = parseInt(levelInput.value, 10);
    if(!isNaN(val)) goToLevel(val);
  }
});
document.getElementById('prev-level').addEventListener('click', () => {
  goToLevel(currentLevel - 1);
});
document.getElementById('next-level').addEventListener('click', () => {
  goToLevel(currentLevel + 1);
});

document.getElementById('tab-time').addEventListener('click', (e) => {
  leaderboardTab = 'time';
